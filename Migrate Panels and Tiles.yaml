name: Migrate Panels and Tiles
platform: node
blocks:
  - action: system/Pliant/automation-center-controller/getAutomationPanelsForUser
    name: sourcePanels
    inputs:
      - name: authKey
        value: $sourceInstanceAuthentication
      - name: userName
        value: $sourceUserName
  - action: foreach-parallel
    name: foreachSourcePanel
    list: $sourcePanels.result
    concurrency: "10"
    blocks:
      - action: try
        name: tryCreatePanel
        try:
          - action: comment
            value: layout for some reason is required property
          - action: system/Pliant/automation-center-controller/createAutomationPanel
            name: createTargetPanel
            inputs:
              - name: authKey
                value: $targetInstanceAuthentication
              - name: userName
                value: $targetUserName
              - name: panelDto
                value: |-
                  {
                      "layout": {},
                      ...JSON.parse(JSON.stringify($foreachSourcePanel.item).replaceAll($sourceUserName, $targetUserName))
                  }
            breakpoint: enabled
          - action: system/Common/Array/Array Push
            name: ArrayPushSuccessPanel
            inputs:
              - name: array
                value: $logs
              - name: item
                value: "{ \n    \"name\": $createTargetPanel.result.name, \n    \"\
                  success\": true\n}"
          - action: system/Pliant/automation-center-controller/getAutomationTilesForPanel
            name: sourceTiles
            inputs:
              - name: authKey
                value: $sourceInstanceAuthentication
              - name: userName
                value: $sourceUserName
              - name: panelName
                value: $foreachSourcePanel.item.name
          - action: foreach
            name: foreachSourceTile
            list: $sourceTiles.result
            blocks:
              - action: try
                name: tryCreateTile
                try:
                  - action: comment
                    value: This function removes the instance id from username and
                      removes revisions usage.
                  - name: fixTile
                    function: "$tempTile = {\r\n    ...JSON.parse(JSON.stringify($foreachSourceTile.item).replaceAll($sourceUserName,\
                      \ $targetUserName)),\r\n    \"flowRevision\": null\r\n}\r\n\r\
                      \nconst vbs = $tempTile.meta?.variableBindings || {};\r\nfor(var\
                      \ vb in vbs){\r\n    if (vbs[vb].type === \"Workflow\") {\r\n\
                      \        vbs[vb].flowRevision = null;\r\n        delete vbs[vb].flowRevisionTimestamp;\r\
                      \n    }\r\n}"
                  - action: system/Pliant/automation-center-controller/createAutomationTile
                    name: createTargetTile
                    inputs:
                      - name: authKey
                        value: $targetInstanceAuthentication
                      - name: userName
                        value: $targetUserName
                      - name: panelName
                        value: $foreachSourcePanel.item.name
                      - name: tileDto
                        value: $tempTile
                  - action: system/Common/Array/Array Push
                    name: ArrayPushSuccessTile
                    inputs:
                      - name: array
                        value: $logs
                      - name: item
                        value: "{ \n    \"name\": $createTargetTile.result.name,\n\
                          \    \"success\": true\n}"
                catch:
                  - action: system/Common/Array/Array Push
                    name: ArrayPushErrorTile
                    inputs:
                      - name: array
                        value: $logs
                      - name: item
                        value: "{ \n    \"name\": $foreachSourceTile.item.name, \n\
                          \    \"success\": false,\n    \"error\": $tryCreateTile.message\n\
                          }"
        catch:
          - action: system/Common/Array/Array Push
            name: ArrayPushErrorPanel
            inputs:
              - name: array
                value: $logs
              - name: item
                value: "{ \n    \"name\": $foreachSourcePanel.item.name, \n    \"\
                  success\": false,\n    \"error\": $tryCreatePanel.message\n}"
variables:
  - name: sourceUserName
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: targetUserName
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: sourceInstanceAuthentication
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
    meta:
      authType: Pliant
      subType: authentication
  - name: targetInstanceAuthentication
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
    meta:
      authType: Pliant
      subType: authentication
  - name: tempTile
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: object
    value: "{}"
  - name: logs
    required: false
    isInput: true
    isOutput: true
    level: INTERMEDIATE
    type:
      type: array
    value: "[]"
meta:
  workerGroup: default
  layout: flat
  version: 5
finally: null
